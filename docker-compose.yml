# Step 20：整套服务一键起。
#
# 前置：在 Windows 的 Docker Desktop 里开启本 WSL 发行版的集成
#       （Settings -> Resources -> WSL Integration -> 勾选本发行版 -> Apply & Restart），
#       然后 `docker version` 能打印版本号即可。保姆级步骤见 DEPLOY.md §2。
#
#   cp .env.example .env && docker compose up --build
#
# 拓扑：
#   browser -> agent-api -> (MCP Client) -> mcp-order / mcp-logistics / mcp-aftersale
#                     \-> postgres (业务数据 + agent_tasks/traces/eval_cases)
#                      \-> redis    (session / agent context / task state)
#
# agent-api 通过 DATABASE_URL / REDIS_URL 真的使用下面这两个服务
# （app/backend.py 的后端工厂），不是摆设。本机未装 Docker 时，
# 可用 scripts/dev_services.sh + uvicorn 达到同样效果（DEPLOY.md §1 路线 A）。
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: hermes
      POSTGRES_PASSWORD: hermes
      POSTGRES_DB: business
    volumes:
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/10-init.sql:ro
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hermes -d business"]
      interval: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 10

  mcp-order:
    build: { context: ., dockerfile: docker/Dockerfile.mcp }
    command: ["python", "-m", "app.mcp.servers.order_server"]
    environment:
      AGENT_DB_PATH: /app/data/business.db
    volumes:
      - ./data:/app/data

  mcp-logistics:
    build: { context: ., dockerfile: docker/Dockerfile.mcp }
    command: ["python", "-m", "app.mcp.servers.logistics_server"]
    environment:
      AGENT_DB_PATH: /app/data/business.db
    volumes:
      - ./data:/app/data

  mcp-aftersale:
    build: { context: ., dockerfile: docker/Dockerfile.mcp }
    command: ["python", "-m", "app.mcp.servers.aftersale_server"]
    environment:
      AGENT_DB_PATH: /app/data/business.db
    volumes:
      - ./data:/app/data

  agent-api:
    build: { context: ., dockerfile: docker/Dockerfile.api }
    environment:
      # 有 GLM_API_KEY 时走 LLM Agent，否则回退确定性 Runtime
      GLM_API_KEY: ${GLM_API_KEY:-}
      GLM_BASE_URL: ${GLM_BASE_URL:-https://open.bigmodel.cn/api/paas/v4}
      GLM_MODEL: ${GLM_MODEL:-glm-4.6}
      # 这两个变量让 app/backend.py 真的切到 Postgres + Redis
      DATABASE_URL: postgresql://hermes:hermes@postgres:5432/business
      REDIS_URL: redis://redis:6379/0
      AGENT_RAG_EMBEDDINGS: ${AGENT_RAG_EMBEDDINGS:-}
    ports:
      - "8077:8077"
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
      mcp-order: { condition: service_started }
      mcp-logistics: { condition: service_started }
      mcp-aftersale: { condition: service_started }

volumes:
  pgdata:
  redisdata:
